name: release

on:
  push:
    branches: [main]
    paths: ["host.luau", "main/**", "utils/**", "HOST_API", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check HOST_API
        run: tools/check-host-api.sh "${{ github.event.before }}"

      - name: Package and upload
        id: package
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Set the SUPABASE_URL repository variable and the SUPABASE_SERVICE_KEY secret." >&2
            exit 1
          fi
          SUPABASE_URL="$(printf %s "$SUPABASE_URL" | tr -d '[:space:]')"
          SUPABASE_SERVICE_KEY="$(printf %s "$SUPABASE_SERVICE_KEY" | tr -d '[:space:]')"
          version="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d HEAD)-$(git rev-parse --short=7 HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          host_api="$(tr -d '[:space:]' < HOST_API)"
          case "$host_api" in ''|*[!0-9]*) echo "HOST_API must be a whole number." >&2; exit 1;; esac

          mkdir out
          zip="lib-$version.zip"
          zip -qr "out/$zip" host.luau main utils -i '*.luau'

          upload() {
            curl -sS --fail -X POST "$SUPABASE_URL/storage/v1/object/client/$2" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "x-upsert: true" -H "Content-Type: $3" -H "cache-control: ${4:-max-age=31536000}" \
              --data-binary "@$1" > /dev/null
          }
          (cd out && sha256sum "$zip" > SHA256SUMS)
          upload "out/$zip" "lib/$version/$zip" application/zip

          curl -sS "$SUPABASE_URL/storage/v1/object/public/client/lib/index.json" -o out/old.json --fail || echo '{"versions":[]}' > out/old.json
          jq -e '.versions | type == "array"' out/old.json > /dev/null 2>&1 || echo '{"versions":[]}' > out/old.json
          jq --arg version "$version" --argjson host "$host_api" --arg path "lib/$version/$zip" \
             --arg sha "$(sha256sum "out/$zip" | cut -d' ' -f1)" \
             '.versions = ([{version: $version, requires_host: $host, path: $path, sha256: $sha}] + [.versions[] | select(.version != $version)])[:20]' \
             out/old.json > out/index.json
          cat out/index.json
          upload out/index.json lib/index.json application/json max-age=60

          sleep 2
          curl -sS --fail "$SUPABASE_URL/storage/v1/object/public/client/lib/index.json?check=$version" -o out/check.json
          jq -e --arg version "$version" '.versions[0].version == $version' out/check.json > /dev/null \
            || { echo "The published lib/index.json is not the index that was uploaded." >&2; exit 1; }

      - name: Keep the package for the release
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            out/lib-*.zip
            out/SHA256SUMS
          if-no-files-found: error

  release:
    name: tag and release
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: out

      - name: Create release
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi
          gh release create "$VERSION" out/* --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
