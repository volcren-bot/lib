name: release

# Publishes the lib the loader downloads for store scripts to the public `client` bucket: lib/<version>/lib-<version>.zip
# and lib/index.json (the last 20 releases, newest first, each with the HOST_API the loader needs). The version is
# YYYY.MM.DD-<7 character commit>, like the loader's. The HOST_API file in the repo root holds that number: bump it in the
# same commit that makes the lib use a new host global.
on:
  push:
    branches: [main]
    paths: ["host.luau", "main/**", "utils/**", "HOST_API", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Package and upload
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Set the SUPABASE_URL repository variable and the SUPABASE_SERVICE_KEY secret." >&2
            exit 1
          fi
          version="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d HEAD)-$(git rev-parse --short=7 HEAD)"
          host_api="$(tr -d '[:space:]' < HOST_API)"
          case "$host_api" in ''|*[!0-9]*) echo "HOST_API must be a whole number." >&2; exit 1;; esac

          mkdir out
          zip="lib-$version.zip"
          zip -qr "out/$zip" host.luau main utils -i '*.luau'

          upload() { # <local file> <path in the bucket> <content type> [cache-control]
            curl -sS --fail -X POST "$SUPABASE_URL/storage/v1/object/client/$2" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "x-upsert: true" -H "Content-Type: $3" -H "cache-control: ${4:-max-age=31536000}" \
              --data-binary "@$1" > /dev/null
          }
          upload "out/$zip" "lib/$version/$zip" application/zip

          # Add this release to the index. A rerun of the same commit replaces its own entry.
          curl -sS "$SUPABASE_URL/storage/v1/object/public/client/lib/index.json" -o out/old.json --fail || echo '{"versions":[]}' > out/old.json
          # An index that can't be parsed is replaced instead of failing the release.
          jq -e '.versions | type == "array"' out/old.json > /dev/null 2>&1 || echo '{"versions":[]}' > out/old.json
          jq --arg version "$version" --argjson host "$host_api" --arg path "lib/$version/$zip" \
             --arg sha "$(sha256sum "out/$zip" | cut -d' ' -f1)" \
             '.versions = ([{version: $version, requires_host: $host, path: $path, sha256: $sha}] + [.versions[] | select(.version != $version)])[:20]' \
             out/old.json > out/index.json
          cat out/index.json
          upload out/index.json lib/index.json application/json max-age=60
